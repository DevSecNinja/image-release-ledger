---
name: Ledger

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  record:
    name: Record first-seen tags
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The only job that writes: it commits to the data branch through
      # GraphQL createCommitOnBranch, so GitHub signs the commit.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record new tags on the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ledger.py --apply
